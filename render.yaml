services:
  - type: web
    name: ungari-vinculos
    runtime: python
    region: virginia
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips=*
    healthCheckPath: /
    disk:
      name: dados
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.9
      - key: DATABASE_PATH
        value: /var/data/vinculos.db
      - key: APP_BASE_URL
        value: https://ungari-vinculos.onrender.com
